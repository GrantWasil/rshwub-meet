name: Rshwub Meet image

on:
  push:
    branches: [main, rshwub-meet]
    tags: ["meet-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rshwub-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'GrantWasil/rshwub-meet'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record application version
        id: version
        run: |
          printf 'value=%s-rshwub.%s\n' "$(node -p 'require("./package.json").version')" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build Node 24 image and publish immutable revision
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/grantwasil/rshwub-meet:sha-${{ github.sha }}
          build-args: |
            SELF_HOSTED=true
            APP_VERSION=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/GrantWasil/rshwub-meet
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=rshwub-meet-amd64
          cache-to: type=gha,mode=max,scope=rshwub-meet-amd64
          provenance: mode=min
          sbom: true
      - name: Package matching source
        run: git archive --format=tar.gz --prefix=rshwub-meet/ --output=rshwub-meet-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rshwub-meet-source-${{ github.sha }}
          path: rshwub-meet-source.tar.gz
          retention-days: 90
      - name: Record deployment image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            printf 'Deploy this immutable image:\n\n'
            printf '`ghcr.io/grantwasil/rshwub-meet@%s`\n\n' "$IMAGE_DIGEST"
            printf 'Source: https://github.com/GrantWasil/rshwub-meet/tree/%s\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
